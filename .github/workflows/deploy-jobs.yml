name: Deploy Jobs Backend to PROD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, gd, zip, pdo_mysql, xml, bcmath, curl, tokenizer, ctype, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy application
        env:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.PORT }}
        run: |
          echo "$key" > /tmp/private_key
          chmod 600 /tmp/private_key

          rsync -avz \
            -e "ssh -i /tmp/private_key -o StrictHostKeyChecking=no -p $port" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='bootstrap/cache' \
            ./ \
            $username@$host:~/jobs.amowogbaje.com

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.PORT }}
          script: |
            cd ~/jobs.amowogbaje.com

            # Clear any stale bootstrap/cache entries before touching config —
            # a cached config.php from a previous deploy can silently shadow
            # new .env values (e.g. AI_PROVIDER, RESUME_AI_PROVIDER) even
            # after migrate runs against the right database.
            php artisan config:clear
            php artisan cache:clear

            php artisan migrate --force

            # Rebuild caches for production performance now that config
            # and routes are guaranteed current.
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # storage/app/resumes holds compiled tailored PDFs — make sure
            # it exists and is writable by the web server after a fresh
            # checkout on a new host, without touching anything already there.
            mkdir -p storage/app/resumes
            chmod -R ug+rwX storage bootstrap/cache